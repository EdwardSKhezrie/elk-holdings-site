<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ELK Holdings</title>
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ELK">
<link rel="icon" href="../crest-icon.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:wght@400;500;600&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* ELK iPhone app. Black, warm ivory text, gold only as an accent. One serif for titles, one sans for reading. */
:root{
  --bg:#000;--card:#0D0C0B;--card2:#16140F;--line:rgba(201,164,92,.16);--line2:rgba(201,164,92,.28);--hair:rgba(255,255,255,.07);
  --ink:#F3EDE1;--muted:#A69E90;--dim:#6F685D;
  --gold:#C9A45C;--gold-hi:#E8CB8A;--pos:#7CC99A;--neg:#E3826F;
  --mark:"Cinzel",Georgia,serif;--disp:"Cormorant Garamond",Georgia,serif;--body:"Figtree",-apple-system,system-ui,sans-serif;
  --top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--pos)}.neg{color:var(--neg)}

#app{position:fixed;inset:0;display:flex;flex-direction:column}
.bar{flex:none;padding:calc(var(--top) + 6px) 20px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(0,0,0,.86);backdrop-filter:saturate(1.3) blur(18px);-webkit-backdrop-filter:saturate(1.3) blur(18px);border-bottom:1px solid transparent;z-index:5;min-height:52px;transition:border-color .2s}
.bar.scrolled{border-bottom-color:var(--line)}
.bar .back{display:flex;align-items:center;gap:6px;color:var(--gold-hi);font-size:1rem;min-width:76px}
.bar .back svg{width:10px;height:18px}
.bar .ttl{font-family:var(--mark);font-weight:500;font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);opacity:0;transition:opacity .2s;text-align:center;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar.scrolled .ttl{opacity:1}
.bar .brand{display:flex;align-items:baseline;gap:7px;min-width:76px}
.bar .brand b{font-family:var(--mark);font-weight:600;letter-spacing:.22em;color:var(--gold-hi);font-size:.95rem}
.bar .brand span{font-family:var(--mark);letter-spacing:.3em;font-size:.55rem;color:var(--muted)}
.bar .act{min-width:76px;text-align:right;color:var(--gold-hi);font-size:.92rem}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 20px calc(100px + var(--bot))}
.screen{display:flex;flex-direction:column;gap:26px;padding-top:6px;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}}
.large{font-family:var(--disp);font-weight:500;font-size:2.5rem;line-height:1.02;margin:8px 0 0;letter-spacing:-.005em}
.kicker{font-family:var(--mark);font-size:.6rem;letter-spacing:.32em;text-transform:uppercase;color:var(--gold)}
.lede{color:var(--muted);font-size:1rem;line-height:1.6;margin:0}
h3.sec{font-family:var(--mark);font-size:.62rem;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin:6px 2px -14px;display:flex;align-items:center;gap:12px}
h3.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--line2),transparent);margin:4px 0}

.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);padding:9px 10px calc(6px + var(--bot));background:rgba(6,6,5,.9);backdrop-filter:saturate(1.3) blur(20px);-webkit-backdrop-filter:saturate(1.3) blur(20px);border-top:1px solid var(--line);z-index:6}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.62rem;font-weight:500;letter-spacing:.04em;color:var(--dim);padding:3px 0}
.tabs svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--gold-hi)}

.group{background:var(--card);border:1px solid var(--hair);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:15px 16px;min-height:60px;width:100%;text-align:left;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--hair)}
.row:active{background:var(--card2)}
.row .ic{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--mark);font-size:.68rem;letter-spacing:.04em;color:var(--gold-hi);border:1px solid var(--line2);background:transparent}
.row .sw{flex:none;width:10px;height:10px;border-radius:3px}
.row .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row .tx b{font-weight:600;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tx small{color:var(--muted);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rt{flex:none;text-align:right;display:flex;flex-direction:column;gap:3px;font-variant-numeric:tabular-nums}
.row .rt b{font-weight:600;font-size:.95rem}
.row .rt small{font-size:.78rem}
.row .chev{flex:none;width:7px;height:12px;color:var(--dim)}
.pill{display:inline-block;font-size:.62rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border-radius:999px;border:1px solid var(--hair);color:var(--muted)}
.pill.on{border-color:var(--line2);color:var(--gold-hi)}
.tkr{font-weight:700;letter-spacing:.04em}

/* home */
.cover{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:10px 0 4px}
.cover img{width:62%;max-width:250px;aspect-ratio:1;object-fit:cover;mix-blend-mode:screen;-webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 62%,transparent 100%);mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 62%,transparent 100%)}
.cover h1{font-family:var(--disp);font-weight:500;font-size:2.55rem;line-height:1.04;margin:0;max-width:11ch}
.cover h1 em{color:var(--gold-hi);font-style:italic}
.cover p{max-width:32ch}
.statement{font-family:var(--disp);font-size:1.55rem;line-height:1.3;margin:0;color:var(--ink)}
.facts{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--hair);border-radius:16px;overflow:hidden;background:var(--card)}
.facts div{padding:16px;display:flex;flex-direction:column;gap:5px}
.facts div:nth-child(odd){border-right:1px solid var(--hair)}
.facts div:nth-child(n+3){border-top:1px solid var(--hair)}
.facts span{font-family:var(--mark);font-size:.55rem;letter-spacing:.26em;text-transform:uppercase;color:var(--dim)}
.facts b{font-weight:500;font-size:.95rem;line-height:1.35}
.prin{display:flex;flex-direction:column;gap:0;border:1px solid var(--hair);border-radius:16px;background:var(--card);overflow:hidden}
.prin div{padding:16px 18px;display:grid;grid-template-columns:34px 1fr;gap:4px 10px}
.prin div+div{border-top:1px solid var(--hair)}
.prin i{font-style:normal;font-family:var(--mark);color:var(--gold);font-size:.75rem;grid-row:span 2;padding-top:3px}
.prin b{font-family:var(--disp);font-weight:600;font-size:1.25rem}
.prin small{color:var(--muted);font-size:.86rem;line-height:1.45}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:14px;background:var(--gold);color:#000;font-weight:600;font-size:1rem;letter-spacing:.01em}
.btn.ghost{background:transparent;color:var(--gold-hi);border:1px solid var(--line2)}
.btn:active{opacity:.8}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 15px;border-radius:999px;border:1px solid var(--hair);color:var(--muted);font-size:.84rem;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--gold);color:var(--gold-hi);background:rgba(201,164,92,.08)}

.cardgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--hair);border-radius:16px;padding:15px;display:flex;flex-direction:column;gap:5px;text-align:left;min-height:96px}
.tile span{font-family:var(--mark);font-size:.55rem;color:var(--dim);letter-spacing:.24em;text-transform:uppercase}
.tile b{font-weight:600;font-size:1.25rem;line-height:1.15;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.tile small{color:var(--muted);font-size:.78rem}

/* portfolio */
.pv{display:flex;flex-direction:column;gap:3px;padding:4px 0 0}
.pv .big{font-family:var(--body);font-weight:600;font-size:2.5rem;letter-spacing:-.025em;font-variant-numeric:tabular-nums;margin:6px 0 2px}
.pv .chg{font-weight:600;font-size:.92rem;font-variant-numeric:tabular-nums}
.pv .chg span{color:var(--dim);font-weight:500}
.chart{position:relative;margin:0 -6px}
.chart svg{width:100%;height:180px;display:block}
.chart .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:.85rem;line-height:1.5;padding:0 34px}
.ranges{display:flex;justify-content:space-between;gap:4px;border-bottom:1px solid var(--hair);padding-bottom:12px}
.ranges button{flex:1;padding:7px 0;border-radius:999px;font-size:.78rem;font-weight:600;color:var(--dim);letter-spacing:.03em}
.ranges button[aria-pressed="true"]{background:rgba(201,164,92,.14);color:var(--gold-hi)}
.rets{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--hair);border-radius:16px;overflow:hidden;background:var(--card)}
.rets div{padding:12px 14px;display:flex;flex-direction:column;gap:3px;font-variant-numeric:tabular-nums}
.rets div:nth-child(n+4){border-top:1px solid var(--hair)}
.rets div:not(:nth-child(3n+1)){border-left:1px solid var(--hair)}
.rets span{font-family:var(--mark);font-size:.55rem;letter-spacing:.22em;color:var(--dim)}
.rets b{font-weight:600;font-size:.98rem}
.rets small{font-size:.7rem;color:var(--dim)}
.alloc{display:flex;height:6px;border-radius:3px;overflow:hidden;gap:2px}
.alloc i{display:block;height:100%}
.note{font-size:.76rem;color:var(--dim);line-height:1.5;margin:0 2px}

.tcard{background:var(--card);border:1px solid var(--hair);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.tcard .h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.tcard h4{margin:0;font-family:var(--disp);font-weight:600;font-size:1.35rem;line-height:1.15}
.tcard p{margin:0;color:var(--muted);font-size:.9rem;line-height:1.5}
.tcard .lk{color:var(--ink)}
.tcard .tk{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--hair);padding-top:11px;font-size:.78rem;color:var(--dim)}
.tcard .tk b{color:var(--gold-hi);letter-spacing:.06em;font-weight:600}

.login{display:flex;flex-direction:column;gap:14px;padding-top:18px}
.login img{width:110px;height:110px;object-fit:cover;mix-blend-mode:screen;align-self:center;-webkit-mask-image:radial-gradient(circle,#000 55%,transparent 72%);mask-image:radial-gradient(circle,#000 55%,transparent 72%)}
.field{background:var(--card);border:1px solid var(--hair);border-radius:14px;padding:4px 16px;display:flex;flex-direction:column}
.field:focus-within{border-color:var(--line2)}
.field label{font-family:var(--mark);font-size:.55rem;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);padding-top:10px}
.field input{background:none;border:0;color:var(--ink);font:inherit;font-size:1.05rem;padding:6px 0 11px;outline:none;width:100%}
.err{color:var(--neg);font-size:.88rem;min-height:1.2em;text-align:center;margin:0}

.photos{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px;padding:0 20px;scrollbar-width:none}
.photos::-webkit-scrollbar{display:none}
.photos figure{flex:none;width:86%;margin:0;scroll-snap-align:center;display:flex;flex-direction:column;gap:7px}
.photos img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:16px;display:block;background:var(--card)}
.photos figcaption{font-size:.74rem;color:var(--dim)}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:3px;border-radius:2px;background:var(--hair)}
.steps i.d{background:var(--gold)}.steps i.n{background:var(--gold-hi)}
.ul{margin:0;padding:0 0 0 18px;color:var(--muted);font-size:.9rem;line-height:1.5;display:flex;flex-direction:column;gap:6px}
.para{color:var(--muted);font-size:.98rem;line-height:1.65;margin:0}
.para strong{color:var(--ink);font-weight:500}
.foot{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;padding:8px 0 4px}
.foot b{font-family:var(--mark);letter-spacing:.3em;color:var(--gold);font-weight:500;font-size:.8rem}
</style></head>
<body>
<div id="app">
  <header class="bar" id="bar">
    <div id="barL"></div><div class="ttl" id="barT"></div><div class="act" id="barR"></div>
  </header>
  <main id="main"></main>
  <nav class="tabs" aria-label="Main">
    <button data-tab="home"><svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20H4z"/><path d="M10 20v-5h4v5"/></svg>Home</button>
    <button data-tab="invest"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Investments</button>
    <button data-tab="firm"><svg viewBox="0 0 24 24"><path d="M3 9l9-5 9 5"/><path d="M5 9v9M9.5 9v9M14.5 9v9M19 9v9M3 20h18"/></svg>Firm</button>
    <button data-tab="portfolio"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Partners</button>
  </nav>
</div>
<script>
const CATS=[{"id":"realestate","name":"Real Estate","sub":"Property and development","intro":"We buy, reposition and build across property types, always looking for a price that sits below what the property can become. Below is every type of real estate we invest in and what we look for in each.","groups":[{"g":"","items":[{"n":"Office","what":"Buildings leased to businesses, from single tenants to downtown towers.","look":"Distressed or under-leased buildings in growing markets, bought well below replacement cost, with a clear plan to lease up.","active":false,"tk":"BXP · VNO"},{"n":"Retail","what":"Shopping centers, strip centers, storefronts and single-tenant retail.","look":"Vacant or under-performing centers we can re-tenant with the right mix of stores and services.","active":false,"tk":"SPG · O"},{"n":"Multifamily","what":"Apartment buildings, from small walk-ups to large communities.","look":"Buildings with below-market rents, deferred upkeep or weak management that we can fix.","active":false,"tk":"VMRK · MAA"},{"n":"Residential Development","what":"Building new homes to sell, from single homes to small communities.","look":"Sites where approvals, a fixed-price contractor and presales can take most of the risk out before we build.","active":false,"tk":"DHI · LEN"},{"n":"Land & Entitlements","what":"Raw or underused land bought to rezone, approve and sell or build.","look":"Land with a clear path to a higher use, where approvals add value on their own.","active":false,"tk":"HHH · JOE"},{"n":"Industrial & Flex","what":"Warehouses, distribution and light industrial space.","look":"Older or vacant buildings near population centers where demand is strong.","active":false,"tk":"PLD · REXR"},{"n":"Mixed-Use","what":"Buildings that combine apartments, retail and office.","look":"Neighborhood properties where one part is under-used and can lift the whole.","active":false,"tk":"FRT · HHH"},{"n":"Hospitality","what":"Hotels and short-stay properties.","look":"Properties that need new management, a brand change or a renovation.","active":false,"tk":"HST · PK"}]}]},{"id":"fixedincome","name":"Fixed Income","sub":"Lending and debt","intro":"Fixed income means owning debt: getting paid interest and principal instead of owning the asset outright. It covers loans secured by real estate and other assets, as well as traditional bonds for steady income and liquidity.","groups":[{"g":"","items":[{"n":"Performing Notes","what":"Buying loans that are being paid on time.","look":"Loans at a discount to face value, backed by collateral we understand.","active":false,"tk":"STWD · BXMT"},{"n":"Non-Performing Notes & Loan-to-Own","what":"Buying loans in default directly from banks and lenders.","look":"Notes where, if the borrower cannot pay, we convert the debt into ownership and take control of the asset.","active":false,"tk":"RITM"},{"n":"Bridge Loans","what":"Short-term loans between a purchase and permanent financing.","look":"Low loan-to-value loans on assets we would be happy to own.","active":false,"tk":"ABR · KREF · RC"},{"n":"Mezzanine & Preferred Equity","what":"Capital that sits between senior debt and the owner's equity.","look":"Deals with strong sponsors where our position is protected by real value below it.","active":false,"tk":"LADR"},{"n":"Private Credit","what":"Direct loans to private companies.","look":"Senior, secured loans to established businesses with steady cash flow.","active":false,"tk":"ARCC · MAIN · BIZD"},{"n":"Government Bonds","what":"U.S. Treasury bills, notes and bonds.","look":"Safe, liquid income for capital waiting to be deployed.","active":false,"tk":"SGOV · IEF · TLT"},{"n":"Corporate Bonds","what":"Debt issued by public and private companies.","look":"Investment-grade and select high-yield issuers with strong coverage.","active":false,"tk":"LQD · HYG"},{"n":"Municipal Bonds","what":"Debt issued by cities, states and public agencies.","look":"Tax-efficient income from well-run issuers.","active":false,"tk":"MUB"}]}]},{"id":"privateequity","name":"Private Equity","sub":"Ownership in private companies","intro":"Private equity means owning stakes in companies that are not traded on a stock exchange. We invest directly and alongside experienced sponsors, across company sizes and deal types.","groups":[{"g":"","items":[{"n":"Buyouts","what":"Buying a controlling stake in an established company.","look":"Profitable businesses where new ownership, better systems and capital can grow earnings.","active":false,"tk":"BX · KKR · APO"},{"n":"Growth Equity","what":"Minority investments in fast-growing companies.","look":"Proven products and revenue, with capital needed to scale.","active":false,"tk":"TPG"},{"n":"Minority Stakes","what":"Partnering with founders and family owners without taking control.","look":"Owner-led companies that want a long-term partner, not a quick flip.","active":false,"tk":"OWL"},{"n":"Co-Investments","what":"Investing directly in a deal alongside a private equity sponsor.","look":"Sponsors with strong records, on terms that line up with theirs.","active":false,"tk":"HLNE"},{"n":"Secondaries","what":"Buying existing stakes in private funds or companies from other investors.","look":"Quality assets bought at a discount from sellers who need liquidity.","active":false,"tk":"STEP · HLNE"},{"n":"Fund Investments","what":"Committing capital to private equity funds managed by others.","look":"Managers with a clear edge in their market and their own money in the fund.","active":false,"tk":"PSP"}]}]},{"id":"venture","name":"Venture Capital","sub":"Early-stage companies","intro":"Venture capital means backing young companies with high growth potential. Most of the return in venture comes from a small number of winners, so we size these investments carefully and look for founders we believe in.","groups":[{"g":"","items":[{"n":"Pre-Seed & Seed","what":"The first outside capital a company raises.","look":"Strong founders solving a real problem in a large market." const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(name,code){
  const h=Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode("elk:"+name)))).map(x=>x.toString(16).padStart(2,"0")).join("");
  const r=await fetch("../portal/vault/"+h+".json",{cache:"no-store"});if(!r.ok)throw 0;const v=await r.json();
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(v.salt),iterations:v.iter,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(v.iv)},key,b64(v.ct))));
}
const tkOf=n=>{const m=/\(([A-Z.]+)\)/.exec(n);return m?m[1]:null};
const clean=n=>n.replace(/\s*\([A-Z.]+\)/,"").replace(/\s·.*$/,"");
function model(d,price,build){const sales=d.homes*price+d.waterPremium,hard=d.homes*build,cont=hard*d.contPct,sell=sales*d.sellPct,costs=d.land+hard+d.soft+cont+sell+d.carry,pre=sales-costs,gc=Math.max(0,pre*d.gcPct);return{sales,net:pre-gc}}
function dealIrr(land,soft,back,T){const cf=new Array(T+1).fill(0);cf[0]-=land;const sm=Math.max(1,Math.min(15,T-8));for(let m=1;m<=sm;m++)cf[m]-=soft/sm;const k=Math.min(6,T);for(let m=T-k+1;m<=T;m++)cf[m]+=back/k;const npv=r=>cf.reduce((a,c,i)=>a+c/Math.pow(1+r,i),0);let lo=-.99,hi=1;if(npv(lo)*npv(hi)>0)return null;for(let i=0;i<100;i++){const mid=(lo+hi)/2;npv(mid)>0?lo=mid:hi=mid}return Math.pow(1+lo,12)-1}

/* Build one clean model of everything the signed-in partner holds */
function buildBook(){
  const P=S.P,inv=P.investor,PR=S.prices.t||{};
  const stocks=[],deals=[],pipeline=[];
  const stock=(t,name,group,cat,shares,buy,costAmt)=>{const p=PR[t]||{},last=p.last||buy,prev=p.prev||last;
    stocks.push({t,name,group,cat,shares,buy,last,prev,cost:costAmt,value:shares*last,day:shares*(last-prev),date:p.lastDate||"",buyDate:p.buyDate||""})};
  (inv.other||[]).forEach(o=>{
    if(o.planned){o.alloc.forEach(([g])=>{(P.examples[g]||[]).forEach(([nm,amt])=>{const t=tkOf(nm),p=PR[t];if(!t)return;const buy=p&&p.buy?p.buy:null;if(!buy)return;stock(t,clean(nm),g,o.cat,amt/buy,buy,amt)})})}
    if(o.pipeline)pipeline.push({cat:o.cat,name:o.pipelineName||"Deal under review",detail:o.pipelineDetail||"",size:o.pipelineSize||""});
  });
  (inv.positions||[]).forEach(p=>stock(p.ticker,p.name,"Individual stock","Public Equities",p.shares,p.cost,p.shares*p.cost));
  Object.keys(inv.holdings||{}).forEach(id=>{const d=P.deals[id],h=inv.holdings[id];if(!d)return;const cost=h.land+(d.soft+d.carry)*h.share;const net=model(d,d.price,d.build).net*h.share;
    const cat=inv.merge&&inv.merge[id]!==undefined?(inv.other[inv.merge[id]]||{}).cat||"Operating Businesses":"Operating Businesses";
    deals.push({id,d,h,cost,value:cost,proj:net,cat,irr:dealIrr(h.land,cost-h.land,cost+net,30),mult:(cost+net)/cost})});
  const cats={};const add=(c,k,v)=>{cats[c]=cats[c]||{cat:c,cost:0,value:0,day:0,n:0};cats[c][k]+=v};
  stocks.forEach(s=>{add(s.cat,"cost",s.cost);add(s.cat,"value",s.value);add(s.cat,"day",s.day);add(s.cat,"n",1)});
  deals.forEach(x=>{add(x.cat,"cost",x.cost);add(x.cat,"value",x.value);add(x.cat,"n",1)});
  pipeline.forEach(x=>{cats[x.cat]=cats[x.cat]||{cat:x.cat,cost:0,value:0,day:0,n:0}});
  const ORDER=["Operating Businesses","Real Estate","Fixed Income","Private Equity","Venture Capital","Service & Trade Businesses","Public Equities"];
  const catList=Object.values(cats).sort((a,b)=>ORDER.indexOf(a.cat)-ORDER.indexOf(b.cat));
  const T=catList.reduce((a,c)=>({cost:a.cost+c.cost,value:a.value+c.value,day:a.day+c.day}),{cost:0,value:0,day:0});
  return{stocks,deals,pipeline,catList,T};
}

function series(B,filter){
  const H=S.H;if(!H||!H.dates||!H.dates.length)return[];
  const st=B.stocks.filter(filter||(()=>true)),dealCost=filter?0:B.deals.reduce((a,x)=>a+x.cost,0);
  const out=[];
  H.dates.forEach((d,i)=>{let v=dealCost,ok=false;st.forEach(s=>{if(d<s.buyDate){v+=s.cost;return}const arr=H.t[s.t]||[];let px=null;for(let j=i;j>=0;j--){if(arr[j]!=null){px=arr[j];break}}if(px==null)px=s.buy;v+=s.shares*px;ok=true});out.push({d,v})});
  return out;
}

  const W=360,Hh=190,pad=8;
  if(pts.length<2){return`<div class="chart"><svg viewBox="0 0 ${W} ${Hh}"><line x1="0" x2="${W}" y1="${Hh-2}" y2="${Hh-2}" stroke="var(--line2)" stroke-dasharray="3 5"/></svg><div class="empty">Tracking started ${fdate(S.prices.buyDate)}. This chart fills in with each day's close.</div></div>`}
  const vs=pts.map(p=>p.v),mn=Math.min(...vs),mx=Math.max(...vs),rg=(mx-mn)||1;
  const x=i=>pad+i*(W-2*pad)/(pts.length-1),y=v=>Hh-pad-((v-mn)/rg)*(Hh-2*pad-16);
  const up=vs[vs.length-1]>=vs[0],col=up?"var(--pos)":"var(--neg)";
  const d=pts.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(p.v).toFixed(1)).join(" ");
  return`<div class="chart"><svg viewBox="0 0 ${W} ${Hh}" id="${id}"><defs><linearGradient id="g${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${up?"#7CC99A":"#E3826F"}" stop-opacity=".28"/><stop offset="1" stop-color="${up?"#7CC99A":"#E3826F"}" stop-opacity="0"/></linearGradient></defs>
    <path d="${d} L${x(pts.length-1)} ${Hh} L${x(0)} ${Hh} Z" fill="url(#g${id})"/><path d="${d}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="${x(pts.length-1)}" cy="${y(vs[vs.length-1])}" r="4" fill="${col}"/></svg></div>`;
}
function valueAt(all,date){let v=null;for(const p of all){if(p.d<=date)v=p.v;else break}return v}
function rangeRet(all,r){if(all.length<1)return null;const last=all[all.length-1],start=rangeStart(r,last.d);
  let base=valueAt(all,start),since=false;if(base==null){base=all[0].v;since=true}
  return{ch:last.v-base,p:base?(last.v-base)/base:0,since}}
function retsGrid(all){const first=all.length?all[0].d:"";
  return`<div class="rets">${["1W","1M","3M","YTD","5Y","All"].map(r=>{const x=rangeRet(all,r);return`<div><span>${r==="All"?"ALL TIME":r}</span><b class="${x?cls(x.ch):""}">${x&&all.length>1?pct(x.p):"—"}</b><small>${x&&all.length>1?sgn(x.ch):"no data yet"}${x&&x.since&&r!=="All"&&all.length>1?" · since "+fdate(first).replace(/, \d{4}/,""):""}</small></div>`}).join("")}</div>`}
function perfBlock(B,filter,id){
  const all=series(B,filter);const last=all.length?all[all.length-1].d:S.prices.asof;
  const start=rangeStart(S.range,last);let pts=all.filter(p=>p.d>=start);
  const bv=valueAt(all,start);if(bv!=null&&pts.length&&pts[0].d>start)pts=[{d:start,v:bv},...pts];
  const firstDate=all.length?all[0].d:"";
  return`${chartHTML(pts,id)}
  <div class="ranges">${["1W","1M","3M","YTD","5Y","All"].map(r=>`<button data-range="${r}" aria-pressed="${S.range===r}">${r}</button>`).join("")}</div>
  ${retsGrid(all)}
  <p class="note">Returns use each trading day's close. Tracking began ${fdate(firstDate||S.prices.buyDate)}, so longer ranges show results since then until there is enough history.</p>`;
}
function wireRanges(){document.querySelectorAll("[data-range]").forEach(b=>b.addEventListener("click",()=>{S.range=b.dataset.range;render(false)}))}

/* ---------- portfolio views ---------- */
VIEWS.portfolio=()=>{
  if(!S.user)return{title:"Partners",html:`
    <form class="login" id="lf" autocomplete="on">
      <img src="../crest-icon.jpg" alt="">
      <div style="text-align:center"><span class="kicker">Partners</span><h2 class="large" style="margin-top:8px">Sign in</h2></div>
      <div class="field"><label for="lu">Login</label><input id="lu" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Your login name"></div>
      <div class="field"><label for="lc">Code</label><input id="lc" type="password" autocomplete="current-password" placeholder="Your code"></div>
      <p class="err" id="le"></p>
      <button class="btn" type="submit" id="lb">Sign in</button>
      <p class="note" style="text-align:center">For partners of ELK Holdings investments only. Your data is encrypted and only opens with your code.</p>
    </form>`,after(){$("#lf").addEventListener("submit",login)}};
  const B=buildBook(),T=B.T,g=T.value-T.cost;
  const stockV=B.stocks.reduce((a,s)=>a+s.value,0);
  return{title:"Portfolio",right:'<button data-act="out" id="out">Sign out</button>',html:`
    <div class="pv"><span class="kicker">${esc(S.P.investor.name)}</span>
      <span class="big">${money(T.value)}</span>
      <span class="chg ${cls(T.day)}">${sgn(T.day)} (${pct(stockV?T.day/(stockV-T.day):0)}) <span style="color:var(--dim);font-weight:500">last trading day</span></span>
      <span class="chg ${cls(g)}">${sgn(g)} (${pct(T.cost?g/T.cost:0)}) <span style="color:var(--dim);font-weight:500">all time</span></span></div>
    ${perfBlock(B,null,"pc")}
    <div class="cardgrid">
      <div class="tile"><span>Invested</span><b class="num">${money(T.cost)}</b><small>${B.stocks.length+B.deals.length} holdings</small></div>
      <div class="tile"><span>Prices as of</span><b>${fdate(S.prices.asof).replace(/, \d{4}/,"")}</b><small>updated every morning</small></div>
    </div>
    <h3 class="sec">Allocation</h3>
    <div class="alloc">${B.catList.filter(c=>c.value>0).map(c=>`<i style="flex:${c.value};background:${COLORS[c.cat]}"></i>`).join("")}</div>
    <div class="group">${B.catList.map(c=>`<button class="row" data-go="pcat" data-p='${JSON.stringify({cat:c.cat})}'><span class="sw" style="background:${COLORS[c.cat]}"></span><span class="tx"><b>${esc(c.cat)}</b><small>${c.n?c.n+" holding"+(c.n>1?"s":""):"Under review"}${T.value&&c.value?" · "+(c.value/T.value*100).toFixed(1)+"%":""}</small></span><span class="rt"><b>${money(c.value)}</b><small class="${cls(c.value-c.cost)}">${c.cost?pct((c.value-c.cost)/c.cost):"—"}</small></span>${chev}</button>`).join("")}</div>
    ${B.stocks.length?`<h3 class="sec">${B.stocks.some(s=>Math.abs(s.day)>0.5)?"Biggest movers":"Largest holdings"}</h3>
    <div class="group">${B.stocks.slice().sort((a,b)=>Math.abs(b.day)-Math.abs(a.day)||b.value-a.value).slice(0,5).map(s=>stockRow(s)).join("")}</div>
    <button class="btn ghost" data-go="stocks">All ${B.stocks.length} stocks &amp; funds</button>`:""}
    <p class="note">Stocks assume purchase at each holding's first close (${fdate(S.prices.buyDate)}). Deals are shown at cost until valued. Not investment advice.</p>`,
    after(){wireRanges();$("#out").addEventListener("click",()=>{location.reload()})}};
};
function stockRow(s){const r=(s.last-s.buy)/s.buy,dp=s.prev?(s.last-s.prev)/s.prev:0;
  return`<button class="row" data-go="stock" data-p='${JSON.stringify({t:s.t,group:s.group})}'><span class="tx"><b><span class="tkr">${esc(s.t)}</span> <span style="font-weight:500;color:var(--muted)">${esc(s.name)}</span></b><small>${s.shares.toLocaleString("en-US",{maximumFractionDigits:2})} sh · ${money(s.last,2)}</small></span><span class="rt"><b>${money(s.value)}</b><small class="${cls(dp)}">${pct(dp)} today</small></span>${chev}</button>`}
async function login(e){e.preventDefault();const u=$("#lu").value.trim().toLowerCase(),c=$("#lc").value.trim().toLowerCase(),er=$("#le");
  if(!u||!c){er.textContent="Enter your login and your code.";return}
  er.style.color="var(--muted)";er.textContent="Signing in…";$("#lb").disabled=true;
  try{S.P=await unlock(u,c);
    try{S.prices=await (await fetch("../prices.json",{cache:"no-store"})).json()}catch(x){S.prices={t:{}}}
    try{S.H=await (await fetch("../history.json",{cache:"no-store"})).json()}catch(x){S.H=null}
    S.user=u;render(true);}
  catch(x){er.style.color="";er.textContent="That login and code don't match.";$("#lc").value="";$("#lb").disabled=false}}

VIEWS.pcat=p=>{const B=buildBook(),c=B.catList.find(x=>x.cat===p.cat)||{cat:p.cat,cost:0,value:0,day:0};
  const st=B.stocks.filter(s=>s.cat===p.cat),dl=B.deals.filter(x=>x.cat===p.cat),pl=B.pipeline.filter(x=>x.cat===p.cat);
  const groups={};st.forEach(s=>{(groups[s.group]=groups[s.group]||[]).push(s)});
  const g=c.value-c.cost;
  return{title:p.cat,html:`
    <div class="pv"><span class="kicker">${esc(p.cat)}</span><span class="big">${money(c.value)}</span>
      ${c.cost?`<span class="chg ${cls(g)}">${sgn(g)} (${pct(g/c.cost)}) <span style="color:var(--dim);font-weight:500">since purchase</span></span>`:""}
      ${st.length?`<span class="chg ${cls(c.day)}">${sgn(c.day)} <span style="color:var(--dim);font-weight:500">last trading day</span></span>`:""}</div>
    ${st.length?perfBlock(B,s=>s.cat===p.cat,"cc"):""}
    ${dl.length?`<h3 class="sec">Hands-on investments</h3><div class="group">${dl.map(x=>`<button class="row" data-go="deal" data-p='${JSON.stringify({id:x.id})}'><span class="tx"><b>${esc(x.d.name)}</b><small>${esc(x.d.status)} · ${esc(x.d.city.split(",")[0])}</small></span><span class="rt"><b>${money(x.cost)}</b><small class="pos">+${money(x.proj)} proj.</small></span>${chev}</button>`).join("")}</div>`:""}
    ${pl.length?`<h3 class="sec">Under review</h3><div class="group">${pl.map(x=>`<div class="row"><span class="tx"><b>${esc(x.name)}</b><small style="white-space:normal">${esc(x.detail)}</small></span><span class="rt"><b>$0</b><small>invested</small></span></div>`).join("")}</div>`:""}
    ${Object.keys(groups).map(gn=>{const gs=groups[gn],gv=gs.reduce((a,s)=>a+s.value,0),gc=gs.reduce((a,s)=>a+s.cost,0);return`<h3 class="sec">${esc(gn)} · ${money(gv)} <span class="${cls(gv-gc)}" style="text-transform:none">${pct(gc?(gv-gc)/gc:0)}</span></h3><div class="group">${gs.map(stockRow).join("")}</div>`}).join("")}
    `,after:wireRanges};};

VIEWS.stocks=()=>{const B=buildBook();const cats=["All",...new Set(B.stocks.map(s=>s.cat))];const f=S.catFilter;
  const list=B.stocks.filter(s=>f==="All"||s.cat===f).sort((a,b)=>b.value-a.value);const tv=list.reduce((a,s)=>a+s.value,0);
  return{title:"All Stocks",html:`
    <div><span class="kicker">Where your money is held</span><h2 class="large">All Stocks</h2></div>
    <div class="chips">${cats.map(c=>`<button class="chip" data-cf="${esc(c)}" aria-pressed="${f===c}">${esc(c==="Service & Trade Businesses"?"Service & Trade":c)}</button>`).join("")}</div>
    <div class="cardgrid"><div class="tile"><span>Value</span><b class="num">${money(tv)}</b><small>${list.length} holdings</small></div><div class="tile"><span>Last day</span><b class="num ${cls(list.reduce((a,s)=>a+s.day,0))}">${sgn(list.reduce((a,s)=>a+s.day,0))}</b><small>${fdate(S.prices.asof)}</small></div></div>
    <div class="group">${list.map(stockRow).join("")}</div>`,
    after(){document.querySelectorAll("[data-cf]").forEach(b=>b.addEventListener("click",()=>{S.catFilter=b.dataset.cf;render(false)}))}};};

VIEWS.stock=p=>{const B=buildBook(),s=B.stocks.find(x=>x.t===p.t&&(!p.group||x.group===p.group))||B.stocks.find(x=>x.t===p.t);if(!s)return VIEWS.portfolio();
  const g=s.value-s.cost,dp=s.prev?(s.last-s.prev)/s.prev:0;
  return{title:s.t,html:`
    <div class="pv"><span class="kicker">${esc(s.cat)} · ${esc(s.group)}</span><span class="large" style="font-family:var(--body);font-weight:700;font-size:2rem">${esc(s.name)}</span>
      <span class="big" style="font-size:2rem">${money(s.last,2)}</span>
      <span class="chg ${cls(dp)}">${s.prev?sgn(s.last-s.prev,2)+" ("+pct(dp)+")":"—"} <span style="color:var(--dim);font-weight:500">${fdate(s.date)}</span></span></div>
    ${perfBlock(B,x=>x.t===s.t&&x.group===s.group,"sc")}
    <div class="cardgrid">
      <div class="tile"><span>Your value</span><b class="num">${money(s.value)}</b><small>${s.shares.toLocaleString("en-US",{maximumFractionDigits:2})} shares</small></div>
      <div class="tile"><span>Gain</span><b class="num ${cls(g)}">${sgn(g)}</b><small class="${cls(g)}">${pct(g/s.cost)} since purchase</small></div>
      <div class="tile"><span>Bought at</span><b class="num">${money(s.buy,2)}</b><small>${fdate(s.buyDate)}</small></div>
      <div class="tile"><span>Invested</span><b class="num">${money(s.cost)}</b><small>${(s.value/(B.T.value||1)*100).toFixed(2)}% of portfolio</small></div>
    </div>`,after:wireRanges};};

VIEWS.deal=p=>{const B=buildBook(),x=B.deals.find(z=>z.id===p.id);if(!x)return VIEWS.portfolio();const d=x.d,u=d.updates[0];
  return{title:d.name,html:`
    <div><span class="kicker">${esc(x.cat)} · ${esc(d.status)}</span><h2 class="large">${esc(d.name)}</h2><p class="lede" style="margin-top:6px">${esc(d.city)} · ${esc(d.type)}</p></div>
    <div class="photos">${d.photos.map(([k,cap])=>S.P.images[k]?`<figure><img src="${S.P.images[k]}" alt=""><figcaption>${esc(cap)}</figcaption></figure>`:"").join("")}</div>
    <div class="cardgrid">
      <div class="tile"><span>Your capital</span><b class="num">${money(x.cost)}</b><small>${(x.h.share*100).toFixed(0)}% ownership</small></div>
      <div class="tile"><span>Projected profit</span><b class="num pos">${money(x.proj)}</b><small>your share</small></div>
      <div class="tile"><span>Multiple</span><b class="num">${x.mult.toFixed(2)}x</b><small>projected</small></div>
      <div class="tile"><span>IRR</span><b class="num">${x.irr==null?"—":(x.irr*100).toFixed(1)+"%"}</b><small>~2.5-year plan</small></div>
    </div>
    <div class="tcard"><div class="h"><h4>Progress</h4><span class="pill on">${esc(d.stages[d.stage])}</span></div>
      <div class="steps">${d.stages.map((s,i)=>`<i class="${i<d.stage?"d":i===d.stage?"n":""}"></i>`).join("")}</div>
      <p style="font-size:.78rem;color:var(--dim)">${d.stages.join(" → ")}</p></div>
    <div class="tcard"><div class="h"><h4>${esc(u.head)}</h4><span class="pill">${esc(u.m)}</span></div><ul class="ul">${u.pts.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>
    <h3 class="sec">Milestones</h3>
    <div class="group">${d.done.map(t=>`<div class="row"><span class="ic" style="width:24px;height:24px;font-size:.7rem">✓</span><span class="tx"><small style="white-space:normal;color:var(--ink);font-size:.88rem">${esc(t)}</small></span></div>`).join("")}${d.next.map(t=>`<div class="row"><span class="ic" style="width:24px;height:24px;font-size:.7rem;color:var(--dim);border-color:var(--hair)">→</span><span class="tx"><small style="white-space:normal;color:var(--muted);font-size:.88rem">Next: ${esc(t)}</small></span></div>`).join("")}</div>
    <h3 class="sec">Updates</h3>
    <div class="group">${d.updates.map(z=>`<div class="row"><span class="tx"><b style="white-space:normal">${esc(z.head)}</b><small>${esc(z.m)}</small></span></div>`).join("")}</div>`};};

/* go */
(function(){const h=(location.hash||"").slice(1);if(["home","invest","portfolio","firm"].includes(h))S.tab=h;render(true)})();
