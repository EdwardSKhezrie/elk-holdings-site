<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Partner Portal · ELK Holdings</title><link rel="icon" href="/crest-icon.jpg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:wght@400;500&family=Figtree:wght@400;500&display=swap">
<style>
:root{--bg:#000;--ink:#EEE7D8;--muted:#A39A8A;--gold:#C9A45C;--gold-hi:#E8CB8A;--line:#2B261E;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}

h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;font-size:2.4rem;margin:0}
p{color:var(--muted);line-height:1.6;margin:0}
a{color:var(--gold-hi)}
</style></head><body>
<div class="box">
  <img src="/crest-icon.jpg" alt="">
  <div class="ey">Investor Portal</div>
  <h1>Partner sign in</h1>

</div>
