<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ELK Deal Room</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.png">
<meta name="apple-mobile-web-app-title" content="Deal Room">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
@font-face{font-family:"ELK Serif";src:url("Caladea-Bold.ttf");font-weight:700;font-display:swap}
@font-face{font-family:"ELK Sans";src:url("Carlito-Regular.ttf");font-weight:400;font-display:swap}
@font-face{font-family:"ELK Sans";src:url("Carlito-Bold.ttf");font-weight:700;font-display:swap}
:root{
  --navy:#1F2A44; --brass:#C9A227; --brass-soft:#F3EBCF;
  --paper:#F2F3F5; --line:#DDE1E8; --ink:#1A2236; --slate:#5E6E91;
  --serif:"ELK Serif",Cambria,Georgia,serif; --sans:"ELK Sans",Calibri,"Segoe UI",Arial,sans-serif;
  --bar:64px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--sans);font-size:15.5px;line-height:1.45;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
a{color:inherit}

.top{background:#000;color:#fff;padding:max(10px,env(safe-area-inset-top)) 18px 10px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
.top img{width:42px;height:42px;object-fit:cover;border-radius:8px}
.top .t{line-height:1.1}
.top .t small{display:block;color:var(--brass);font-size:10.5px;letter-spacing:.38em;font-weight:700}
.top .t b{font-family:var(--serif);font-size:20px;font-weight:700}
.top .grow{flex:1}
.top .sync{font-size:12.5px;color:#AEB7CB;background:none;border:1px solid #2A3550;border-radius:20px;padding:5px 11px;cursor:pointer}

.main{max-width:1000px;margin:0 auto;padding:22px 18px calc(var(--bar) + 40px + env(safe-area-inset-bottom))}
h1{font-family:var(--serif);font-size:32px;line-height:1.1;margin:0;color:var(--navy)}
.sub{color:var(--slate);margin-top:5px}
.head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.head .grow{flex:1}
.btn{border:0;border-radius:9px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--navy);color:#fff}
.btn.brass{background:var(--brass);color:#000}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--navy)}
.btn:disabled{opacity:.5;cursor:default}
.search{border:1px solid var(--line);border-radius:9px;padding:11px 13px;background:#fff;width:260px;max-width:100%}
.muted{color:var(--slate)}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
.panel h3{font-family:var(--serif);font-size:19px;color:var(--navy);margin:0 0 8px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:26px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-family:var(--serif);font-size:26px;color:var(--navy);line-height:1.1}
.stat span{font-size:13px;color:var(--slate)}
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:24px 14px}
.folder{background:#fff;border:1px solid var(--line);border-radius:4px 12px 12px 12px;padding:0;cursor:pointer;text-align:left;position:relative;display:flex;flex-direction:column}
.folder::before{content:"";position:absolute;top:-9px;left:-1px;width:42%;height:10px;background:var(--navy);border-radius:7px 7px 0 0}
.folder .fh{background:var(--navy);color:#fff;padding:12px 16px 11px;border-radius:0 11px 0 0;border-bottom:3px solid var(--brass)}
.folder .fn{font-family:var(--serif);font-size:18px;line-height:1.2}
.folder .fa{font-size:12.5px;color:#AEB7CB;margin-top:2px}
.folder .fb{padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px;flex:1}
.folder .nm{font-weight:700;font-size:16px;color:var(--navy)}
.folder:hover{border-color:#B9C2D3}
.nums{display:flex;gap:18px}
.nums div b{display:block;font-family:var(--serif);font-size:18px;color:var(--navy);font-variant-numeric:tabular-nums}
.nums div span{font-size:11.5px;color:var(--slate)}
.st{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--slate)}
.st i{width:8px;height:8px;border-radius:50%;background:#AEB7CB}
.st.ready{color:var(--navy);font-weight:700}.st.ready i{background:var(--brass)}
.empty{background:#fff;border:1px solid var(--line);border-radius:12px;padding:44px 26px;text-align:center}
.empty h2{font-family:var(--serif);font-size:25px;color:var(--navy);margin:0 0 8px}
.empty p{color:var(--slate);max-width:440px;margin:0 auto 18px}

.back{all:unset;cursor:pointer;color:var(--slate);margin-bottom:14px;display:inline-block}
.hero{background:var(--navy);color:#fff;border-radius:14px;padding:24px 24px 20px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--brass)}
.hero .path{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:#C8CEDB;background:#24304D;border-radius:20px;padding:4px 11px;margin-bottom:12px}
.hero h1{color:#fff;font-size:32px}
.hero .ad{color:#C8CEDB;margin-top:5px}
.figs{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:#33405F;border-radius:9px;overflow:hidden;margin-top:18px}
.figs div{background:#24304D;padding:11px 13px}
.figs b{display:block;font-family:var(--serif);font-size:21px;color:#fff;font-variant-numeric:tabular-nums}
.figs span{font-size:12px;color:#AEB7CB}
.figs .hi b{color:var(--brass)}
.memos{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 22px}
.cols{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;align-items:start}
.file{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.file:first-of-type{border-top:0}
.file button{all:unset;cursor:pointer;font-weight:700;color:var(--navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .ext{flex:0 0 40px;height:24px;border-radius:5px;background:var(--paper);color:var(--slate);font-size:11px;font-weight:700;display:grid;place-items:center}
.file .ext.pdf{background:#F6E2E2;color:#9B2C2C}
.file .sz{margin-left:auto;color:var(--slate);font-size:13px;flex:0 0 auto}
.checks strong{display:block;font-family:var(--serif);color:var(--navy);margin:12px 0 3px;font-size:15.5px}
.checks strong:first-child{margin-top:0}
.checks p{margin:0 0 4px;padding-left:12px;text-indent:-12px;font-size:14px}

.drop{border:2px dashed #AEB7CB;border-radius:14px;padding:34px 18px;text-align:center;cursor:pointer;color:var(--slate);background:#fff}
.drop svg{width:38px;height:38px;color:var(--brass);margin-bottom:6px}
.drop b{color:var(--navy);display:block;font-size:17px;margin-bottom:2px}
.drop.on{border-color:var(--brass);background:var(--brass-soft)}
.picked{list-style:none;margin:10px 0 0;padding:0}
.picked li{display:flex;gap:10px;padding:8px 0;font-size:14.5px;border-top:1px solid var(--line);align-items:center}
.picked li span{margin-left:auto;color:var(--slate)}
.picked li button{all:unset;cursor:pointer;color:var(--slate);padding:0 6px;font-size:18px}
.field{margin-top:14px}
.field label{display:block;font-size:13.5px;font-weight:700;color:var(--slate);margin-bottom:4px}
.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px 12px;background:#fff}
.field textarea{min-height:90px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sendrow{display:flex;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}

.item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item .dot{flex:0 0 10px;height:10px;border-radius:50%;margin-top:6px;background:var(--brass)}
.item .dot.need{background:#C2410C}
.item b{color:var(--navy)}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar nav{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--bar)}
.tabbar button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#7F8AA3;font-size:12px;font-weight:700;position:relative}
.tabbar button svg{width:25px;height:25px}
.tabbar button[aria-current="page"]{color:var(--navy)}
.tabbar button[aria-current="page"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--brass)}
.tabbar button[aria-current="page"] svg{color:var(--brass)}
.tabbar .badge{position:absolute;top:8px;left:calc(50% + 6px);background:#C2410C;color:#fff;font-size:10.5px;border-radius:10px;padding:0 5px;line-height:16px;min-width:16px;text-align:center}
.tabbar button:focus-visible{outline:2px solid var(--brass);outline-offset:-4px;border-radius:8px}

.toast{position:fixed;left:50%;bottom:calc(var(--bar) + 18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000;color:#fff;padding:11px 18px;border-radius:9px;display:none;z-index:30;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:90vw}
ol.steps{padding-left:20px;line-height:1.75;margin:0}

@media (max-width:700px){
  h1{font-size:28px}
  .hero h1{font-size:27px}
  .figs{grid-template-columns:repeat(3,1fr)}
  .cols,.two{grid-template-columns:1fr}
  .stats{gap:8px}.stat b{font-size:22px}
  .search{width:100%}
  .head .btn{display:none}
}
</style>
</head>
<body>
<header class="top">
  <img src="crest.jpg" alt="">
  <div class="t"><small>ELK HOLDINGS</small><b>Deal Room</b></div>
  <div class="grow"></div>
  <button class="sync" id="sync">Refresh</button>
</header>
<main class="main" id="main"></main>

<div class="tabbar"><nav aria-label="Sections">
  <button data-tab="deals" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7.5V18a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9.5a2 2 0 0 0-2-2h-7.2L9.6 5H5a2 2 0 0 0-2 2.5Z"/></svg>Deals</button>
  <button data-tab="send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Send a deal</button>
  <button data-tab="inbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 13h5l1.5 3h5L16 13h5"/><path d="M5.5 5h13L21 13v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-5Z"/></svg>Inbox<span class="badge" id="badge" hidden></span></button>
  <button data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2" fill="#fff"/><circle cx="15" cy="12" r="2" fill="#fff"/><circle cx="8" cy="18" r="2" fill="#fff"/></svg>Settings</button>
</nav></div>
<div class="toast" id="toast" role="status"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LS = { get(k, d){ try{ return JSON.parse(localStorage.getItem("room-" + k)) ?? d; }catch(e){ return d; } }, set(k, v){ try{ localStorage.setItem("room-" + k, JSON.stringify(v)); }catch(e){} } };
let cfg = LS.get("cfg", { repo: "EdwardSKhezrie/elk-deal-room", token: "" });
function hqCfg(){ try{ return JSON.parse(localStorage.getItem("elkhq-cfg")) || {}; }catch(e){ return {}; } }
if (!cfg.token && hqCfg().token) cfg.token = hqCfg().token;   // one key works for the ELK app and the Deal Room
function saveKey(tok){
  cfg.token = tok; LS.set("cfg", cfg);
  try{ const h = hqCfg(); h.token = tok; h.room = h.room || cfg.repo; h.finds = h.finds || "EdwardSKhezrie/elk-deal-finds"; localStorage.setItem("elkhq-cfg", JSON.stringify(h)); }catch(e){}
}
const KEY_URL = "https://github.com/settings/tokens/new?scopes=repo&description=ELK%20Deal%20Room";
let INDEX = { deals: [], waiting: [] }, INBOX = [], branch = "main", FILES = [], loaded = false;
const fmtM = x => x == null ? "—" : "$" + (x / 1e6).toFixed(x >= 1e8 ? 0 : 1) + "M";
const pct = x => x == null ? "—" : (x * 100).toFixed(1) + "%";
const size = b => b > 1e6 ? (b / 1e6).toFixed(1) + " MB" : Math.max(1, Math.round(b / 1e3)) + " KB";
const FOLDER_ICON = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7.5V18a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9.5a2 2 0 0 0-2-2h-7.2L9.6 5H5a2 2 0 0 0-2 2.5Z"/></svg>';
function toast(t, ms){ const e = $("#toast"); e.textContent = t; e.style.display = "block"; clearTimeout(e._t); e._t = setTimeout(() => e.style.display = "none", ms || 2800); }
function tab(which){ document.querySelectorAll(".tabbar button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === which ? "page" : "false")); window.scrollTo(0, 0); }

async function gh(path, opts = {}){
  const r = await fetch("https://api.github.com" + path, Object.assign({}, opts, { headers: Object.assign({ Authorization: "Bearer " + cfg.token, Accept: "application/vnd.github+json" }, opts.headers || {}) }));
  if (!r.ok){ const t = await r.text(); throw new Error(r.status === 401 ? "Your GitHub key isn't working. Paste a new one in Settings." : r.status === 404 ? "Can't find the repo. Check the repo name in Settings, and that the key has access to it." : r.status + " " + t.slice(0, 160)); }
  return opts.raw ? r : (r.status === 204 ? null : r.json());
}
const R = p => `/repos/${cfg.repo}` + p;
const P = p => "/contents/" + p.split("/").map(encodeURIComponent).join("/");
const decode = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\n/g, "")), c => c.charCodeAt(0)));

async function load(){
  if (!cfg.token){ location.hash = "more"; return false; }
  try{
    const repo = await gh(R(""));
    branch = repo.default_branch || "main";
    try{ INDEX = JSON.parse(decode((await gh(R(P("deals/index.json")))).content)); }catch(e){ INDEX = { deals: [], waiting: [] }; }
    try{ INBOX = (await gh(R(P("inbox")))).filter(x => x.type === "dir"); }catch(e){ INBOX = []; }
    loaded = true;
    const n = INBOX.length + (INDEX.waiting || []).length;
    const b = $("#badge"); b.hidden = !n; b.textContent = n;
    return true;
  }catch(e){
    $("#main").innerHTML = `<div class="empty"><h2>Can't open the Deal Room</h2><p>${esc(e.message)}</p><button class="btn" onclick="location.hash='more'">Open settings</button></div>`;
    return false;
  }
}

/* ---------- routing: #deals  #send  #inbox  #more  #folder=<name> ---------- */
async function route(){
  const r = location.hash.slice(1) || "deals";
  if (r === "send"){ tab("send"); return send(); }
  if (r === "more"){ tab("more"); return more(); }
  if (!loaded){ $("#main").innerHTML = '<p class="muted">Loading your deals…</p>'; if (!(await load())) return; }
  if (r.startsWith("folder=")){ tab("deals"); return folder(decodeURIComponent(r.slice(7))); }
  if (r === "inbox"){ tab("inbox"); return inbox(); }
  tab("deals"); deals();
}
window.addEventListener("hashchange", route);
document.querySelectorAll(".tabbar button").forEach(b => b.onclick = () => { if (location.hash.slice(1) === b.dataset.tab) route(); else location.hash = b.dataset.tab; });
$("#sync").onclick = () => { loaded = false; toast("Refreshing"); route(); };

/* ---------- Deals: every folder, named by area (address added when an area has more than one) ---------- */
function deals(){
  const all = (INDEX.deals || []).slice().sort((a, b) => a.folder.localeCompare(b.folder));
  const q = (LS.get("q", "") || "").toLowerCase();
  const list = all.filter(d => !q || [d.folder, d.name, d.address, d.area, d.source, d.status].join(" ").toLowerCase().includes(q));
  const ready = all.filter(d => /ready/i.test(d.status || "")).length;
  const areas = new Set(all.map(d => d.area)).size;
  let h = `<div class="head"><div><h1>Deals</h1><div class="sub">One folder per deal, named by area. Two or more in the same area get the address added.</div></div><div class="grow"></div>
    <input class="search" id="q" placeholder="Search area, address, broker" value="${esc(q)}" aria-label="Search deals"><button class="btn brass" onclick="location.hash='send'">Send a deal</button></div>
    <div class="stats"><div class="stat"><b>${all.length}</b><span>deals</span></div><div class="stat"><b>${areas}</b><span>areas</span></div><div class="stat"><b>${ready}</b><span>memos ready</span></div></div>`;
  if (!all.length) h += `<div class="empty"><h2>No deals yet</h2><p>Send in an OM and it gets its own folder here, with the investor memo ready to open.</p><button class="btn brass" onclick="location.hash='send'">Send a deal</button></div>`;
  else if (!list.length) h += `<div class="empty"><h2>Nothing matches "${esc(q)}"</h2><p>Try a city, a street or a broker's name.</p></div>`;
  else {
    h += `<div class="folders">`;
    list.forEach(d => {
      const ok = /ready/i.test(d.status || "");
      const parts = d.folder.split(" - ");
      h += `<button class="folder" data-f="${esc(d.folder)}">
        <div class="fh"><div class="fn">${esc(parts[0])}</div><div class="fa">${parts[1] ? esc(parts.slice(1).join(" - ")) : esc(d.address || "")}</div></div>
        <div class="fb"><div class="nm">${esc(d.name)}</div>
        <div class="nums"><div><b>${fmtM(d.price)}</b><span>Price</span></div><div><b>${pct(d.cap_now)}</b><span>Cap</span></div><div><b>${d.moic ? d.moic.toFixed(1) + "x" : "—"}</b><span>MOIC</span></div><div><b>${pct(d.irr)}</b><span>IRR</span></div></div>
        <div class="st ${ok ? "ready" : ""}"><i></i>${esc(d.status || "In progress")}</div></div></button>`;
    });
    h += `</div>`;
  }
  $("#main").innerHTML = h;
  document.querySelectorAll(".folder").forEach(e => e.onclick = () => { location.hash = "folder=" + encodeURIComponent(e.dataset.f); });
  const qi = $("#q");
  if (qi) qi.oninput = () => { LS.set("q", qi.value); clearTimeout(window._qt); window._qt = setTimeout(() => { deals(); const i = $("#q"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 250); };
}

async function folder(f){
  $("#main").innerHTML = '<p class="muted">Opening the folder…</p>';
  const d = (INDEX.deals || []).find(x => x.folder === f) || { name: f };
  let items = [], src = [];
  try{ items = await gh(R(P("deals/" + f))); }catch(e){}
  try{ src = await gh(R(P(`deals/${f}/source`))); }catch(e){}
  const inv = items.find(x => /Investor Memorandum\.pdf$/.test(x.name));
  const full = items.find(x => /Full Underwriting\)\.pdf$/.test(x.name));
  const html = items.filter(x => /\.html$/.test(x.name));
  const ext = n => (n.split(".").pop() || "").toUpperCase().slice(0, 4);
  const row = x => `<div class="file"><span class="ext ${/\.pdf$/i.test(x.name) ? "pdf" : ""}">${esc(ext(x.name))}</span><button data-p="${esc(x.path)}" data-n="${esc(x.name)}">${esc(x.name)}</button><span class="sz">${size(x.size)}</span></div>`;
  const fig = (v, l, hi) => `<div class="${hi ? "hi" : ""}"><b>${v}</b><span>${l}</span></div>`;
  $("#main").innerHTML = `<button class="back" onclick="location.hash='deals'">← All deals</button>
  <div class="hero"><div class="path">${FOLDER_ICON} ${esc(f)}</div><h1>${esc(d.name)}</h1><div class="ad">${esc(d.address || "")}${d.source ? " · from " + esc(d.source) : ""}</div>
   <div class="figs">${fig(fmtM(d.price), "Price")}${fig(pct(d.cap_now), "Cap today")}${fig(pct(d.occupancy), "Occupied")}${fig(d.walt != null ? d.walt.toFixed(1) + " yrs" : "—", "WALT")}${fig(d.moic ? d.moic.toFixed(1) + "x" : "—", "MOIC", 1)}${fig(pct(d.irr), "IRR", 1)}</div></div>
  <div class="memos">${inv ? `<button class="btn brass" data-p="${esc(inv.path)}" data-n="${esc(inv.name)}">Open investor memo</button>` : `<span class="muted">The memo isn't built yet. It shows up here after the next build.</span>`}
   ${full ? `<button class="btn ghost" data-p="${esc(full.path)}" data-n="${esc(full.name)}">Open full underwriting</button>` : ""}</div>
  <div class="cols"><div>
    <div class="panel"><h3>Documents</h3>${src.filter(x => x.type === "file").map(row).join("") || '<p class="muted">No source files yet.</p>'}</div>
    ${html.length ? `<div class="panel"><h3>Editable memo files</h3>${html.map(row).join("")}</div>` : ""}
  </div><div class="panel"><h3>What to confirm with the broker</h3><div class="checks muted" id="checkstxt">Nothing yet.</div></div></div>`;
  document.querySelectorAll("[data-p]").forEach(b => b.onclick = () => openFile(b.dataset.p, b.dataset.n));
  const ck = items.find(x => x.name === "CHECKS.md");
  if (ck){
    try{
      const r = await gh(R(P(ck.path)), { raw: true, headers: { Accept: "application/vnd.github.raw" } });
      const nice = h => h.replace("Missing ([NEED])", "Still missing").replace("Layout", "Memo layout");
      const t = (await r.text()).split("\n").filter(l => l.trim() && !/^# /.test(l) && !/^MOIC /.test(l));
      $("#checkstxt").innerHTML = t.map(l => /^## /.test(l) ? `<strong>${esc(nice(l.slice(3)))}</strong>` : `<p>${esc(l.replace(/^- /, "• "))}</p>`).join("");
      $("#checkstxt").classList.remove("muted");
    }catch(e){}
  }
}

async function openFile(p, n){
  const type = /\.pdf$/i.test(n) ? "application/pdf" : /\.html$/i.test(n) ? "text/html" : /\.(md|txt)$/i.test(n) ? "text/plain" : /\.jpe?g$/i.test(n) ? "image/jpeg" : /\.png$/i.test(n) ? "image/png" : "";
  const w = type ? window.open("", "_blank") : null;
  toast("Opening " + n);
  try{
    const r = await gh(R(P(p)), { raw: true, headers: { Accept: "application/vnd.github.raw" } });
    const url = URL.createObjectURL(new Blob([await r.arrayBuffer()], { type: type || "application/octet-stream" }));
    if (w) w.location = url; else { const a = document.createElement("a"); a.href = url; a.download = n; a.click(); }
  }catch(e){ if (w) w.close(); toast("Couldn't open it. " + e.message, 4500); }
}

/* ---------- Send a deal ---------- */
function send(){
  if (!cfg.token){ location.hash = "more"; return; }
  $("#main").innerHTML = `<div class="head"><div><h1>Send a deal</h1><div class="sub">Drop the OM and anything that came with it. The next build turns it into an ELK memo in its own folder.</div></div></div>
  <div class="drop" id="drop" tabindex="0" role="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5"/><path d="M4 14v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg><b>Drop files here</b>or tap to choose them: OM, rent roll, P&amp;L, photos, broker email</div>
  <input type="file" id="pick" multiple hidden>
  <ul class="picked" id="picked"></ul>
  <div class="panel" style="margin-top:16px">
   <div class="two"><div class="field" style="margin-top:0"><label for="f-name">Property name</label><input id="f-name" placeholder="Property name"></div>
   <div class="field" style="margin-top:0"><label for="f-addr">Address</label><input id="f-addr" placeholder="Street, City, State"></div></div>
   <div class="two"><div class="field"><label for="f-from">Sent by</label><input id="f-from" placeholder="Broker and firm"></div>
   <div class="field"><label for="f-price">Price or terms</label><input id="f-price" placeholder="Buy at a 14 cap, sell at a 10"></div></div>
   <div class="field"><label for="f-note">Notes for the memo</label><textarea id="f-note" placeholder="Call notes, guidance, what I want to offer…"></textarea></div>
   <div class="sendrow"><button class="btn brass" id="send">Send to Deal Room</button><span class="muted" id="sendst"></span></div>
  </div>`;
  const drop = $("#drop"), pick = $("#pick");
  const show = () => { $("#picked").innerHTML = FILES.map((f, i) => `<li>${esc(f.name)}<span>${size(f.size)}</span><button data-i="${i}" aria-label="Remove ${esc(f.name)}">×</button></li>`).join("");
    document.querySelectorAll("#picked button").forEach(b => b.onclick = () => { FILES.splice(+b.dataset.i, 1); show(); }); };
  drop.onclick = () => pick.click();
  drop.onkeydown = e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); pick.click(); } };
  pick.onchange = () => { FILES = FILES.concat([...pick.files]); pick.value = ""; show(); };
  drop.ondragover = e => { e.preventDefault(); drop.classList.add("on"); };
  drop.ondragleave = () => drop.classList.remove("on");
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove("on"); FILES = FILES.concat([...e.dataTransfer.files]); show(); };
  show();
  $("#send").onclick = doSend;
}
const b64 = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result.split(",")[1]); r.onerror = rej; r.readAsDataURL(f); });
async function doSend(){
  const name = $("#f-name").value.trim(), addr = $("#f-addr").value.trim();
  if (!FILES.length && !$("#f-note").value.trim()) return toast("Add a file or a note first");
  const big = FILES.find(f => f.size > 95e6);
  if (big) return toast(big.name + " is over 95 MB, which is GitHub's limit. Split or compress it.", 5000);
  const btn = $("#send"), st = $("#sendst");
  btn.disabled = true;
  try{
    if (!loaded && !(await load())) throw new Error("Can't reach GitHub.");
    const slug = (name || addr || FILES[0]?.name || "deal").toLowerCase().replace(/\.[a-z0-9]+$/, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 50);
    const dir = `inbox/${new Date().toISOString().slice(0, 10)}-${slug}`;
    const tree = [];
    for (let i = 0; i < FILES.length; i++){
      st.textContent = `Uploading ${i + 1} of ${FILES.length}`;
      const blob = await gh(R("/git/blobs"), { method: "POST", body: JSON.stringify({ content: await b64(FILES[i]), encoding: "base64" }) });
      tree.push({ path: `${dir}/${FILES[i].name.replace(/[\\/]/g, "-")}`, mode: "100644", type: "blob", sha: blob.sha });
    }
    const note = { name, address: addr, from: $("#f-from").value.trim(), price: $("#f-price").value.trim(), note: $("#f-note").value.trim(), files: FILES.map(f => f.name), sent: new Date().toISOString(), via: "Deal Room app" };
    const nb = await gh(R("/git/blobs"), { method: "POST", body: JSON.stringify({ content: JSON.stringify(note, null, 1), encoding: "utf-8" }) });
    tree.push({ path: `${dir}/note.json`, mode: "100644", type: "blob", sha: nb.sha });
    st.textContent = "Saving";
    const ref = await gh(R(`/git/ref/heads/${branch}`));
    const head = await gh(R(`/git/commits/${ref.object.sha}`));
    const t = await gh(R("/git/trees"), { method: "POST", body: JSON.stringify({ base_tree: head.tree.sha, tree }) });
    const c = await gh(R("/git/commits"), { method: "POST", body: JSON.stringify({ message: `Inbox: ${name || addr || FILES.map(f => f.name).join(", ")}`, tree: t.sha, parents: [ref.object.sha] }) });
    await gh(R(`/git/refs/heads/${branch}`), { method: "PATCH", body: JSON.stringify({ sha: c.sha }) });
    FILES = [];
    toast("Sent. The memo will be built on the next run.", 3800);
    loaded = false; location.hash = "inbox";
  }catch(e){ st.textContent = ""; toast("Didn't send. " + e.message, 5500); btn.disabled = false; }
}

/* ---------- Inbox: what's waiting to be built ---------- */
function inbox(){
  const wait = INDEX.waiting || [];
  let h = `<div class="head"><div><h1>Inbox</h1><div class="sub">Deals that came in and are waiting for the next build. Memos are built at 7:43am, 1:43pm, 5:43pm and 9:43pm.</div></div></div>`;
  if (!INBOX.length && !wait.length) h += `<div class="empty"><h2>All caught up</h2><p>Nothing is waiting. New OMs you send, and broker replies with an OM, show up here first.</p><button class="btn brass" onclick="location.hash='send'">Send a deal</button></div>`;
  else {
    h += `<div class="panel">`;
    h += INBOX.map(x => `<div class="item"><span class="dot"></span><div><b>${esc(x.name.replace(/^\d{4}-\d{2}-\d{2}-/, "").replace(/-/g, " ").replace(/\b\w/g, c => c.toUpperCase()))}</b><div class="muted">Received ${esc(x.name.slice(0, 10))}. The memo is coming on the next build.</div></div></div>`).join("");
    h += wait.map(w => `<div class="item"><span class="dot need"></span><div><b>${esc(w.name || w.address || "Deal")}</b><div class="muted">${esc(w.note || "Needs a file")}${w.from ? " · from " + esc(w.from) : ""}${w.date ? " · " + esc(w.date) : ""}</div></div></div>`).join("");
    h += `</div>`;
  }
  $("#main").innerHTML = h;
}

/* ---------- Settings: GitHub key + install on computer and iPhone ---------- */
let deferredInstall = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredInstall = e; });
const standalone = () => window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;
function more(){
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  $("#main").innerHTML = `<div class="head"><div><h1>Settings</h1><div class="sub">Connect your GitHub, and install the Deal Room on your computer and iPhone.</div></div></div>
  ${cfg.token ? `<div class="panel" style="border-color:#C9A227"><h3>✓ Connected to GitHub</h3><p class="muted" style="margin:0 0 12px">Your deals load from your private <b>elk-deal-room</b> repo. The key is saved on this device only.</p>
   <div class="sendrow" style="margin-top:0"><button class="btn brass" onclick="location.hash='deals'">Open my deals</button><button class="btn ghost" id="s-out">Disconnect this device</button></div></div>`
  : `<div class="panel"><h3>Connect to GitHub — 3 steps, one time</h3>
   <ol class="steps"><li>Tap <b>Get my key</b>. GitHub opens with everything filled in.</li>
   <li>Set <b>Expiration</b> to <b>No expiration</b>, scroll down and tap <b>Generate token</b>, then copy it.</li>
   <li>Come back here, tap <b>Paste</b>, then <b>Connect</b>.</li></ol>
   <div class="sendrow"><a class="btn brass" href="${KEY_URL}" target="_blank" rel="noopener" style="text-decoration:none">Get my key</a></div>
   <div class="field"><label for="s-tok">Your GitHub key</label><div style="display:flex;gap:8px"><input id="s-tok" type="password" placeholder="ghp_… or github_pat_…" autocomplete="off" style="flex:1"><button class="btn ghost" id="s-paste" type="button">Paste</button></div></div>
   <div class="sendrow"><button class="btn" id="s-save">Connect</button><span class="muted" id="s-st"></span></div>
   <p class="muted" style="margin:12px 0 0;font-size:13.5px">Your key stays on this device only. It's never stored on this website or sent anywhere except GitHub.</p></div>`}
  ${standalone() ? "" : `<div class="panel"><h3>Install on your computer</h3>
   ${deferredInstall ? '<p class="muted" style="margin-top:0">It opens in its own window, with the ELK icon in your Start menu or Dock.</p><button class="btn brass" id="do-install">Install on this computer</button>'
     : '<p class="muted" style="margin-top:0">In Chrome or Edge, click the install icon at the right end of the address bar, then <b>Install</b>. On a Mac in Safari: <b>File → Add to Dock</b>.</p>'}</div>
  <div class="panel"><h3>Install on your iPhone</h3>
   <ol class="steps"><li>Open this page in <b>Safari</b>.</li><li>Tap <b>Share</b> (the square with an arrow).</li><li>Tap <b>Add to Home Screen</b>, then <b>Add</b>.</li></ol>
   ${ios ? "" : '<p class="muted">Or scan this with your iPhone camera to open it there:</p><img alt="QR code that opens the Deal Room" width="150" height="150" style="border:8px solid #fff;border-radius:10px;box-shadow:0 0 0 1px #DDE1E8" src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=0&data=' + encodeURIComponent(location.origin + location.pathname) + '">'}
   <p class="muted" style="margin-bottom:0">Paste your GitHub key once on each device.</p></div>`}`;
  if ($("#s-paste")) $("#s-paste").onclick = async () => { try{ $("#s-tok").value = (await navigator.clipboard.readText()).trim(); }catch(e){ toast("Long-press the box and tap Paste"); } };
  if ($("#s-save")) $("#s-save").onclick = async () => {
    const tok = $("#s-tok").value.trim();
    if (!tok) return toast("Paste your GitHub key first");
    $("#s-st").textContent = "Checking…";
    try{
      const r = await fetch(`https://api.github.com/repos/${cfg.repo}`, { headers: { Authorization: "Bearer " + tok, Accept: "application/vnd.github+json" } });
      if (r.status === 401) throw new Error("That key didn't work. Copy it again from GitHub and paste it.");
      if (!r.ok) throw new Error("The key works, but it can't open elk-deal-room. Make a new one with Get my key.");
      saveKey(tok); loaded = false; toast("Connected", 2000); location.hash = "deals";
    }catch(e){ $("#s-st").textContent = ""; toast(e.message, 6000); }
  };
  if ($("#s-out")) $("#s-out").onclick = () => { saveKey(""); loaded = false; more(); };
  const b = $("#do-install");
  if (b) b.onclick = async () => { deferredInstall.prompt(); const r = await deferredInstall.userChoice; deferredInstall = null; toast(r.outcome === "accepted" ? "Installed" : "Not installed"); more(); };
}

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js", { scope: "./" }).catch(() => {});
